version: '3.9'

services:
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: local-postgres
    environment:
      POSTGRES_USER: user      # Added: Matches Spring Boot username
      POSTGRES_PASSWORD: password  # Matches Spring Boot password
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"    # Metrics endpoint (for Collector health)
      - "55680:55679"  # zPages (debug UI for Collector)

    depends_on:
      - jaeger

  # Jaeger (All-in-One)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC ingest
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:

