name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d inventory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Inventory Service
        run: ./mvnw -B package -DskipTests --file pom.xml

      - name: Install ramjam
        run: |
          curl -L -o ramjam https://github.com/michaelmccabe/ramjam/releases/download/v1.0.0-beta.1/ramjam-linux-amd64
          chmod +x ramjam
          sudo mv ramjam /usr/local/bin/

      - name: Start Inventory Service
        run: |
          java -jar target/Inventory-1.0-SNAPSHOT.jar &
          echo "APP_PID=$!" >> $GITHUB_ENV
          echo "Waiting for Inventory Service to start..."
          curl --retry 12 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/actuator/health

      - name: Run ramjam integration tests
        run: ramjam run ramjam-test/ --verbose

      - name: Stop Inventory Service
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill $APP_PID || true
          fi
