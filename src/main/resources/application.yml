spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # Fixes the WARN (prod best practice)
  flyway:
    locations: classpath:db/migration
    threads:
      virtual:
        enabled: true

management:
  tracing:
    sampling:
      probability: 1.0  # 100% capture
  otlp:
    tracing:
      endpoint: http://127.0.0.1:4318/v1/traces  # HTTP + path
    logging:
      endpoint: http://127.0.0.1:4318/v1/logs  # HTTP + path
  # Batch tuning to avoid size errors
  metrics:
    export:
      step: 30s

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n'  # Enhanced pattern with timestamp
  level:
    io.micrometer.tracing: TRACE
    io.opentelemetry: TRACE
    io.opentelemetry.exporter: TRACE
    io.opentelemetry.exporter.otlp: TRACE
    io.opentelemetry.exporter.internal.http.HttpExporter: TRACE
    io.opentelemetry.context.ContextStorageWrappers: TRACE
    okhttp3.internal: TRACE
    com.mictech: TRACE
