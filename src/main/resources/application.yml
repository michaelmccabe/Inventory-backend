spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # Fixes the WARN (prod best practice)
  flyway:
    locations: classpath:db/migration
    threads:
      virtual:
        enabled: true

otel:
  service:
    name: inventory-service
  resource:
    attributes: service.namespace=com.mictech,service.version=1.0
  traces:
    exporter: otlp
    sampler: parentbased_traceidratio
    sampler.arg: 1.0
  metrics:
    exporter: otlp
    export:
      interval: 60000
      timeout: 30000
  logs:
    exporter: otlp
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
  propagators: tracecontext,baggage

management:
  endpoints:
    web:
      exposure:
        include: health,info,trace
  endpoint:
    health:
      enabled: true

logging:
  pattern:
    level: '%d{yyyy-MM-dd HH:mm:ss} [%X{trace_id:-},%X{span_id:-}] %-5level %logger{36} - %msg%n'  # Enhanced pattern with timestamp
  level:
    root: INFO
    io.micrometer.tracing: TRACE  # Max verbose for activation
    io.opentelemetry: TRACE       # Full SDK (tracer init, spans)
    io.opentelemetry.exporter.otlp: TRACE  # Export batches/errors
    com.mictech: DEBUG            # App logic